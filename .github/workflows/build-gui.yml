name: Build Elodie GUI EXE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Optional Git tag to attach the built EXE to (e.g. v1.0.0).
          If provided, a Release will be created/updated with the EXE.
          Leave empty to only upload the EXE as a build artifact.
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PySide6 send2trash piexif pillow-heif future six requests tabulate

      - name: Verify ExifTool config is bundled
        run: Test-Path configs\ExifTool_config

      - name: Build EXE with PyInstaller
        run: python -m PyInstaller --noconfirm --clean gui_elodie.spec

      - name: Upload EXE as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elodie-GUI
          path: dist/Elodie GUI/

      - name: Determine release tag
        id: tag
        shell: pwsh
        run: |
          $t = if ("${{ inputs.tag }}" -ne "") { "${{ inputs.tag }}" } elseif ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "" }
          Write-Output "tag=$t"
          Write-Output "tag=$t" >> $env:GITHUB_OUTPUT

      - name: Package EXE into a zip
        if: steps.tag.outputs.tag != ''
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Elodie GUI/Elodie GUI.exe" -DestinationPath "Elodie-GUI.zip" -Force

      - name: Create/Update Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: Elodie-GUI.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
